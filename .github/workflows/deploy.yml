name: Deploy via SSH (Key Authentication)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    # I-bypass ang Node.js Windows OS version check para sa lumang Windows OS
    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Files using Rsync
        shell: bash
        run: |
          SSH_HOST="10.0.4.10"
          SSH_USER="archer.cabahug"
          TARGET_DIR="/volume1/EKSystem/EKSystem Version 3.5/GH"
          KEY_PATH="/c/Users/mathew/.ssh/id_rsa"

          # 1. Siguraduhing gawa ang directory sa remote server
          ssh -i "$KEY_PATH" -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" "mkdir -p \"$TARGET_DIR\""

          # 2. I-sync ang files gamit ang rsync
          rsync -av -e "ssh -i $KEY_PATH -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            ./ "$SSH_USER@$SSH_HOST:\"$TARGET_DIR/\""