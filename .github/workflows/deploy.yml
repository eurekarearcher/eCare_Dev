name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # Force TLS 1.2 at gumamit ng System.Net.WebClient para ma-bypass ang Invoke-WebRequest restriction
          $sshpassPath = "C:\Program Files\Git\usr\bin\sshpass.exe"
          
          if (-not (Test-Path $sshpassPath)) {
              Write-Host "Downloading sshpass using WebClient fallback..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls11 -bor [Net.SecurityProtocolType]::Tls
              $wc = New-Object System.Net.WebClient
              $wc.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")
              $wc.DownloadFile("https://github.com/marlon-m/sshpass-win/raw/master/sshpass.exe", $sshpassPath)
          }

          # Isulat ang deploy.sh file gamit ang ASCII encoding
          $scriptContent = @"
          set -e

          echo "Cleaning target directory..."
          sshpass -p '$SSH_PASS' ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive ${SSH_USER}@${SSH_HOST} "mkdir -p \"$TARGET_DIR\" && rm -rf \"$TARGET_DIR\"/* \"$TARGET_DIR\"/.[!.]*"

          echo "Uploading and extracting files..."
          tar --exclude='.git' --exclude='.github' -czf - . | sshpass -p '$SSH_PASS' ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive ${SSH_USER}@${SSH_HOST} "tar -xzf - -C \"$TARGET_DIR\""
          "@

          Set-Content -Path "deploy.sh" -Value $scriptContent -Encoding ASCII

          # Execute via Git Bash
          & "C:\Program Files\Git\bin\bash.exe" "deploy.sh"

          # Cleanup
          Remove-Item -Path "deploy.sh" -Force