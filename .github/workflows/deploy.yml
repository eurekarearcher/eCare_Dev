name: Deploy via SSH (Key Authentication)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Files using Rsync
        shell: bash
        run: |
          SSH_HOST="10.0.4.10"
          SSH_USER="archer.cabahug"
          TARGET_DIR="/volume1/EKSystem/EKSystem Version 3.5/eCare System Frontend Code/eCare 3.5.9"

          # Absolute path sa SSH Key ng Windows user account
          SSH_KEY_PATH="C:/Users/mathew/.ssh/id_rsa"
          
          # SSH command setup para sa Non-Interactive Runner
          SSH_CMD="ssh -i \"$SSH_KEY_PATH\" -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes"

          # 1. Siguraduhing gawa ang directory sa remote server
          $SSH_CMD "$SSH_USER@$SSH_HOST" "mkdir -p \"$TARGET_DIR\""

          # 2. I-sync ang files gamit ang rsync over SSH Key
          rsync -av -e "$SSH_CMD" \
            --exclude='.git' \
            --exclude='.github' \
            . "$SSH_USER@$SSH_HOST:\"$TARGET_DIR\""