name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # 1. Gumawa ng temporary askpass helper para sa password prompt ng native SSH
          $askpassScript = @"
          #!/bin/sh
          echo "$SSH_PASS"
          "@
          Set-Content -Path "askpass.sh" -Value $askpassScript -Encoding ASCII

          # 2. Isulat ang deploy.sh file gamit ang ASCII encoding (No BOM)
          $scriptContent = @"
          set -e

          export DISPLAY=:0
          export SSH_ASKPASS="./askpass.sh"

          echo "Cleaning target directory..."
          setsid ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "mkdir -p \"$TARGET_DIR\" && rm -rf \"$TARGET_DIR\"/* \"$TARGET_DIR\"/.[!.]*" < /dev/null

          echo "Uploading and extracting files..."
          tar --exclude='.git' --exclude='.github' -czf - . | setsid ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "tar -xzf - -C \"$TARGET_DIR\"" < /dev/null
          "@

          Set-Content -Path "deploy.sh" -Value $scriptContent -Encoding ASCII

          # 3. I-execute sa Git Bash
          & "C:\Program Files\Git\bin\bash.exe" "deploy.sh"

          # 4. Cleanup
          Remove-Item -Path "deploy.sh" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "askpass.sh" -Force -ErrorAction SilentlyContinue