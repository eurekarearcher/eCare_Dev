name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # Download sshpass for Windows inside Git Bash if not present
          $bashPath = "C:\Program Files\Git\bin\bash.exe"

          $scriptContent = @"
          set -e

          # Install sshpass binary inside runner environment if needed
          if ! command -v sshpass &> /dev/null; then
              echo "Downloading sshpass for Windows..."
              curl -sSL https://github.com/cmcqueen/sshpass-for-windows/releases/download/v1.06/sshpass.exe -o /usr/bin/sshpass.exe || true
          fi

          SSH_CMD="sshpass -p '$SSH_PASS' ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive ${SSH_USER}@${SSH_HOST}"

          echo "Cleaning target directory..."
          \$SSH_CMD "mkdir -p \"$TARGET_DIR\" && rm -rf \"$TARGET_DIR\"/* \"$TARGET_DIR\"/.[!.]*"

          echo "Uploading and extracting files..."
          tar --exclude='.git' --exclude='.github' -czf - . | \$SSH_CMD "tar -xzf - -C \"$TARGET_DIR\""
          "@

          Set-Content -Path "deploy.sh" -Value $scriptContent

          & $bashPath "deploy.sh"

          Remove-Item -Path "deploy.sh" -Force