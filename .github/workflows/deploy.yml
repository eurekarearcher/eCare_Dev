name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # 1. Download plink.exe kung wala pa sa Git bin folder
          $plinkPath = "C:\Program Files\Git\usr\bin\plink.exe"

          if (-not (Test-Path $plinkPath)) {
              Write-Host "Downloading plink.exe..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              Invoke-WebRequest -Uri "https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe" -OutFile $plinkPath
          }

          # 2. Isulat ang deployment commands sa Git Bash
          $bashPath = "C:\Program Files\Git\bin\bash.exe"

          Write-Host "Cleaning target directory..."
          & $bashPath -c "'/c/Program Files/Git/usr/bin/plink.exe' -ssh -batch -pw '$SSH_PASS' ${SSH_USER}@${SSH_HOST} \"mkdir -p '$TARGET_DIR' && rm -rf '$TARGET_DIR'/* '$TARGET_DIR'/.[!.]*\""

          Write-Host "Uploading and extracting files..."
          & $bashPath -c "tar --exclude='.git' --exclude='.github' -czf - . | '/c/Program Files/Git/usr/bin/plink.exe' -ssh -batch -pw '$SSH_PASS' ${SSH_USER}@${SSH_HOST} \"tar -xzf - -C '$TARGET_DIR'\""