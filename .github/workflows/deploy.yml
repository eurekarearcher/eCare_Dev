name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: bash
        run: |
          SSH_HOST=$(echo "${{ secrets.DEV_HOST_KEY }}" | tr -d '\r\n ')
          SSH_USER=$(echo "${{ secrets.DEV_USER_KEY }}" | tr -d '\r\n ')
          BRANCH_NAME="${{ github.ref_name }}"

          case "$BRANCH_NAME" in
            "demo")
              TARGET_DIR="/volume1/EKSystem/EKSystem Version 3.5/GH/demo"
              ;;
            "qa")
              TARGET_DIR="/volume1/EKSystem/EKSystem Version 3.5/GH/qa"
              ;;
            "main")
              TARGET_DIR="/volume1/EKSystem/EKSystem Version 3.5/GH"
              ;;
            *)
              echo "Unknown branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

          echo "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # 1. Linisin ang target directory sa server
          ssh -o StrictHostKeyChecking=no -l "$SSH_USER" "$SSH_HOST" "mkdir -p \"$TARGET_DIR\" && rm -rf \"$TARGET_DIR\"/* \"$TARGET_DIR\"/.[!.]*"

          # 2. I-compress at i-transfer ang buong laman ng repo diretso sa server
          tar --exclude='.git' --exclude='.github' -czf - . | ssh -o StrictHostKeyChecking=no -l "$SSH_USER" "$SSH_HOST" "tar -xzf - -C \"$TARGET_DIR\""