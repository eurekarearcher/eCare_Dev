name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # Isusulat ang SSH password session sa panandaliang Bash script gamit ang simple SSH stream
          $bashPath = "C:\Program Files\Git\bin\bash.exe"
          
          $scriptContent = @"
          set -e

          # Pagkopya gamit ang pure tar/ssh at password stream sa Git Bash
          export SSHPASS="$SSH_PASS"

          # Gumawa ng SSH connection command para sa directory cleanup at extraction
          echo "Cleaning target directory..."
          "C:\Program Files\Git\usr\bin\ssh.exe" -o StrictHostKeyChecking=no -o PreferredAuthentications=password ${SSH_USER}@${SSH_HOST} "mkdir -p '$TARGET_DIR' && rm -rf '$TARGET_DIR'/* '$TARGET_DIR'/.[!.]*" <<EOF
          $SSH_PASS
          EOF

          echo "Uploading and extracting files...."
          tar --exclude='.git' --exclude='.github' -czf - . | "C:\Program Files\Git\usr\bin\ssh.exe" -o StrictHostKeyChecking=no -o PreferredAuthentications=password ${SSH_USER}@${SSH_HOST} "tar -xzf - -C '$TARGET_DIR'" <<EOF
          $SSH_PASS
          EOF
          "@

          Set-Content -Path "deploy.sh" -Value $scriptContent -Encoding ASCII

          & $bashPath "deploy.sh"

          Remove-Item -Path "deploy.sh" -Force -ErrorAction SilentlyContinue