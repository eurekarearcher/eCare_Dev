name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # 1. Siguraduhing may sshpass.exe sa Git bin folder
          $gitBin = "C:\Program Files\Git\usr\bin"
          $sshpassPath = "$gitBin\sshpass.exe"
          
          if (-not (Test-Path $sshpassPath)) {
              Write-Host "Downloading sshpass.exe..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/marlon-m/sshpass-win/master/sshpass.exe" -OutFile $sshpassPath
          }

          # 2. Isulat ang malinis na deploy.sh file
          $scriptContent = @"
          set -e

          SSH_CMD="sshpass -p '$SSH_PASS' ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive ${SSH_USER}@${SSH_HOST}"

          echo "Cleaning target directory..."
          eval \$SSH_CMD '"mkdir -p \"$TARGET_DIR\" && rm -rf \"$TARGET_DIR\"/* \"$TARGET_DIR\"/.[!.]*"'

          echo "Uploading and extracting files..."
          tar --exclude='.git' --exclude='.github' -czf - . | eval \$SSH_CMD '"tar -xzf - -C \"$TARGET_DIR\""'
          "@

          Set-Content -Path "deploy.sh" -Value $scriptContent -Encoding UTF8

          # 3. I-execute sa Git Bash
          & "C:\Program Files\Git\bin\bash.exe" "deploy.sh"

          # 4. Cleanups
          Remove-Item -Path "deploy.sh" -Force