name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # 1. Download plink.exe kung wala pa
          $plinkPath = "C:\Program Files\Git\usr\bin\plink.exe"

          if (-not (Test-Path $plinkPath)) {
              Write-Host "Downloading plink.exe..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              Invoke-WebRequest -Uri "https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe" -OutFile $plinkPath
          }

          # 2. Isulat sa temporary bash script gamit ang tamang Plink execution path
          $bashScriptContent = @"
          set -e

          PLINK="/c/Program Files/Git/usr/bin/plink.exe"

          echo "Cleaning target directory..."
          "\$PLINK" -ssh -batch -pw "$SSH_PASS" ${SSH_USER}@${SSH_HOST} "mkdir -p '$TARGET_DIR' && rm -rf '$TARGET_DIR'/* '$TARGET_DIR'/.[!.]*"

          echo "Uploading and extracting files..."
          tar --exclude='.git' --exclude='.github' -czf - . | "\$PLINK" -ssh -batch -pw "$SSH_PASS" ${SSH_USER}@${SSH_HOST} "tar -xzf - -C '$TARGET_DIR'"
          "@

          # Ayusin ang string substitution bago isulat ang script
          $bashScriptContent = $bashScriptContent.Replace('"\$PLINK"', '"/c/Program Files/Git/usr/bin/plink.exe"')

          Set-Content -Path "run_deploy.sh" -Value $bashScriptContent -Encoding ASCII

          # 3. I-run ang script sa Git Bash
          & "C:\Program Files\Git\bin\bash.exe" "run_deploy.sh"

          # 4. Cleanup
          Remove-Item -Path "run_deploy.sh" -Force -ErrorAction SilentlyContinue