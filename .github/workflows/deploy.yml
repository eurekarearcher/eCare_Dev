name: Deploy via SSH (Key Authentication)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Files and Clean Removed Files
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEV_HOST_KEY }}
          SSH_USER: ${{ secrets.DEV_USER_KEY }}
        run: |
          TARGET_DIR="/volume1/EKSystem/EKSystem Version 3.5/GH"
          DEST="$SSH_USER@$SSH_HOST"

          ssh -o StrictHostKeyChecking=no "$DEST" "mkdir -p \"$TARGET_DIR\" && rm -rf \"$TARGET_DIR\"/* \"$TARGET_DIR\"/.[!.]*"

          tar --exclude='.git' --exclude='.github' -czf - . | ssh -o StrictHostKeyChecking=no "$DEST" "tar -xzf - -C \"$TARGET_DIR\""