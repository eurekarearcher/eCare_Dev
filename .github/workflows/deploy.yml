name: Deploy via SSH (Key Authentication)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Files using SCP
        shell: bash
        run: |
          SSH_HOST="10.0.4.10"
          SSH_USER="archer.cabahug"
          TARGET_DIR="/volume1/EKSystem/EKSystem Version 3.5/GH"

          # 1. Siguraduhing gawa ang directory sa remote server
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" "mkdir -p \"$TARGET_DIR\""

          # 2. I-copy ang lahat ng files gamit ang SCP (rekursibo) sa halip na rsync
          scp -r -o StrictHostKeyChecking=no ./ $SSH_USER@$SSH_HOST:"$TARGET_DIR"