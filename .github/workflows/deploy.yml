name: Deploy Pre-Built Dist via SSH

on:
  push:
    branches:
      - main
      - qa
      - demo

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_SKIP_PLATFORM_CHECK: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Dist Files to Server
        shell: powershell
        run: |
          $SSH_HOST = "${{ secrets.NTEG_HOST_KEY }}".Trim()
          $SSH_USER = "${{ secrets.NTEG_USER_KEY }}".Trim()
          $SSH_PASS = "${{ secrets.NTEG_PASSWORD_KEY }}".Trim()
          $BRANCH_NAME = "${{ github.ref_name }}"

          switch ($BRANCH_NAME) {
            "demo" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/demo" }
            "qa"   { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH/qa" }
            "main" { $TARGET_DIR = "/volume1/EKSYSTEM/EKSystem Version 3.5/GH" }
            default { Write-Error "Unknown branch: $BRANCH_NAME"; exit 1 }
          }

          Write-Host "Deploying contents of [$BRANCH_NAME] to $TARGET_DIR..."

          # Gagamitin ang plink/ssh o curl para sa transfer sa Windows
          $bashPath = "C:\Program Files\Git\bin\bash.exe"
          
          # Isusulat ang script sa temporary bash file para makaiwas sa syntax/quote errors
          $scriptContent = @"
          export SSHPASS='$SSH_PASS'
          
          # Gamit ang SSH pipe para sa hindi nanghihingi ng password confirmation
          ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no ${SSH_USER}@${SSH_HOST} "mkdir -p \"$TARGET_DIR\" && rm -rf \"$TARGET_DIR\"/* \"$TARGET_DIR\"/.[!.]*"
          
          tar --exclude='.git' --exclude='.github' -czf - . | ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no ${SSH_USER}@${SSH_HOST} "tar -xzf - -C \"$TARGET_DIR\""
          "@

          Set-Content -Path "deploy.sh" -Value $scriptContent

          # Patakbuhin gamit ang Git Bash
          & $bashPath "deploy.sh"
          
          Remove-Item -Path "deploy.sh" -Force